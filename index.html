<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="JARVIS - assistente pessoal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/jarvis.svg">
<title>JARVIS</title>
<style>
:root{color-scheme:dark;--gold:#f6c445;--muted:#b9a66c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#29200b 0,#111 38%,#050505 78%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(560px,100%);text-align:center;border:1px solid #80631b;border-radius:24px;padding:28px 20px;background:#080808dc;box-shadow:0 0 35px #d6a62922}
h1{letter-spacing:.28em;color:var(--gold);font-size:clamp(28px,8vw,42px);margin:8px 0}p{color:#d4c79f;line-height:1.5}
.arc{width:150px;height:150px;border:3px solid var(--gold);border-radius:50%;margin:25px auto;display:grid;place-items:center;box-shadow:0 0 22px #e9b72b66,inset 0 0 22px #e9b72b44;position:relative}
.arc:before,.arc:after{content:"";position:absolute;border:1px solid var(--gold);border-radius:50%}.arc:before{inset:12px}.arc:after{inset:28px}
.core{width:32px;height:32px;border-radius:50%;background:var(--gold);box-shadow:0 0 25px var(--gold)}
button{border:1px solid var(--gold);background:#17130a;color:var(--gold);padding:13px 18px;border-radius:12px;font-size:15px;font-weight:bold;margin:6px;cursor:pointer}
button.primary{background:var(--gold);color:#090909}.status{font-size:13px;color:var(--muted);margin:16px 0}.log{min-height:48px;border:1px solid #4c3c16;border-radius:12px;padding:12px;margin:18px 0;color:#f4e5b7}
small{display:block;color:#998b65;margin-top:18px}
</style>
</head>
<body><main>
<div class="arc"><div class="core"></div></div>
<h1>J.A.R.V.I.S.</h1>
<p>Just A Rather Very Intelligent System</p>
<div class="status" id="status">SISTEMA INICIALIZADO • MODO LOCAL</div>
<div class="log" id="output">Olá. Sou o JARVIS. Como posso ajudar?</div>
<button class="primary" id="talk">🎙 Falar com JARVIS</button>
<button id="time">Que horas são?</button>
<button id="date">Qual é a data?</button>
<button id="youtube">Abrir YouTube</button>
<button id="search">Pesquisar na internet</button>
<small>Esta versão possui comandos básicos locais. Recursos de IA conversacional ainda não estão conectados.</small>
</main>
<script>
const out=document.getElementById('output'),status=document.getElementById('status');
function say(t){out.textContent=t; if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.pitch=.82;u.rate=.95;speechSynthesis.speak(u)}}
function command(t){let s=t.toLowerCase();if(s.includes('hora'))say('Agora são '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));else if(s.includes('data')||s.includes('dia'))say('Hoje é '+new Date().toLocaleDateString('pt-BR',{dateStyle:'full'}));else if(s.includes('youtube')){say('Abrindo YouTube.');window.open('https://www.youtube.com','_blank')}else if(s.includes('pesquis')){say('Abrindo uma pesquisa.');window.open('https://www.google.com','_blank')}else say('Ainda não tenho uma resposta inteligente para isso. Posso informar a hora, a data ou abrir sites.')}
document.getElementById('time').onclick=()=>command('hora');document.getElementById('date').onclick=()=>command('data');
document.getElementById('youtube').onclick=()=>command('youtube');document.getElementById('search').onclick=()=>{say('O que deseja pesquisar?');window.open('https://www.google.com','_blank')};
document.getElementById('talk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){say('O reconhecimento de voz não está disponível neste navegador. Você pode usar os botões.');return}let r=new SR();r.lang='pt-BR';r.onstart=()=>status.textContent='OUVINDO...';r.onend=()=>status.textContent='SISTEMA INICIALIZADO • MODO LOCAL';r.onerror=()=>say('Não consegui reconhecer sua voz. Tente novamente.');r.onresult=e=>command(e.results[0][0].transcript);r.start()};
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
